<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan — SIMOPAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
@media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

.bar-chart { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: flex; align-items: center; gap: 12px; }
.bar-label { width: 140px; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.bar-track { flex: 1; height: 28px; background: var(--bg-elev); border-radius: 6px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; background: var(--accent); transition: width 0.5s ease; display: flex; align-items: center; padding: 0 10px; font-size: 11px; font-weight: 700; color: #0a0e1a; font-family: 'JetBrains Mono', monospace; }
.bar-value { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; min-width: 30px; text-align: right; }

.donut-wrap { display: flex; align-items: center; gap: 20px; }
.donut { position: relative; width: 140px; height: 140px; flex-shrink: 0; }
.donut svg { transform: rotate(-90deg); }
.donut-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.donut-center .big { font-family: 'Instrument Serif', serif; font-size: 32px; line-height: 1; }
.donut-center .small { font-size: 10px; color: var(--text-mute); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
.donut-legend { flex: 1; }
.donut-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.donut-dot { width: 12px; height: 12px; border-radius: 3px; }
.donut-label { font-size: 12px; flex: 1; }
.donut-value { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }

.top-list { display: flex; flex-direction: column; gap: 8px; }
.top-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: var(--bg-elev); border-radius: 8px; }
.top-rank { font-family: 'Instrument Serif', serif; font-size: 20px; width: 28px; text-align: center; color: var(--accent); }
.top-info { flex: 1; }
.top-name { font-size: 13px; font-weight: 600; }
.top-meta { font-size: 11px; color: var(--text-mute); font-family: 'JetBrains Mono', monospace; }
.top-count { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="page-title">
        <h1>Laporan & <em>Statistik</em></h1>
        <p>Analisis data kendaraan untuk pengambilan keputusan</p>
      </div>
      <div style="margin-left:auto;display:flex;gap:8px;">
        <button class="btn btn-primary" id="btnExcel" onclick="exportExcel()" style="white-space:nowrap;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download Excel
        </button>
      </div>
    </div>

    <div id="loadingState" class="loading"><div class="loading-spinner"></div>Memuat statistik...</div>

    <div id="content" style="display:none;">
      <div class="grid-3">
        <div class="card">
          <div class="card-header"><h3 class="card-title">Status Pajak Keseluruhan</h3></div>
          <div class="donut-wrap">
            <div class="donut" id="donutChart"></div>
            <div class="donut-legend" id="donutLegend"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3 class="card-title">Kendaraan per Jenis</h3></div>
          <div class="bar-chart" id="jenisChart"></div>
        </div>

        <div class="card">
          <div class="card-header"><h3 class="card-title">Notifikasi 7 Hari Terakhir</h3></div>
          <div class="bar-chart" id="notifWeekChart"></div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-header"><h3 class="card-title">Kendaraan per Asal Hibah</h3></div>
          <div class="bar-chart" id="asalChart"></div>
        </div>

        <div class="card">
          <div class="card-header"><h3 class="card-title">Top 5 PJ (terbanyak kendaraan)</h3></div>
          <div class="top-list" id="topPj"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
async function loadData() {
  const [{ data: kendaraan }, { data: logs }] = await Promise.all([
    supabaseClient.from('kendaraan').select('*'),
    supabaseClient.from('notifikasi_log').select('*').gte('created_at', new Date(Date.now() - 7*24*60*60*1000).toISOString()),
  ]);

  const vehicles = (kendaraan || []).map(dbToUi);

  // Status pajak
  const stats = { active: 0, warning: 0, expired: 0 };
  vehicles.forEach(v => { stats[getStatus(daysUntil(v.pajakDate))] = (stats[getStatus(daysUntil(v.pajakDate))] || 0) + 1; });
  renderDonut(stats);

  // Per jenis
  const byJenis = {};
  vehicles.forEach(v => byJenis[v.jenis] = (byJenis[v.jenis] || 0) + 1);
  renderBar('jenisChart', Object.entries(byJenis).map(([k,v]) => ({ label: k, value: v })));

  // Per asal
  const byAsal = {};
  vehicles.forEach(v => {
    const label = ORIGIN_LABELS[v.asal] || v.asal;
    byAsal[label] = (byAsal[label] || 0) + 1;
  });
  renderBar('asalChart', Object.entries(byAsal).map(([k,v]) => ({ label: k, value: v })));

  // Notif 7 hari
  const notifByDay = {};
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = d.toLocaleDateString('id-ID', { weekday: 'short' });
    notifByDay[key + '_' + i] = { label: key, value: 0 };
  }
  (logs || []).forEach(l => {
    const d = new Date(l.created_at);
    const diff = Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60 * 24));
    if (diff >= 0 && diff <= 6) {
      const key = d.toLocaleDateString('id-ID', { weekday: 'short' });
      const k = key + '_' + diff;
      if (notifByDay[k]) notifByDay[k].value++;
    }
  });
  renderBar('notifWeekChart', Object.values(notifByDay));

  // Top PJ
  const pjMap = {};
  vehicles.forEach(v => {
    const k = v.pj + '|' + v.hp;
    if (!pjMap[k]) pjMap[k] = { pj: v.pj, hp: v.hp, count: 0 };
    pjMap[k].count++;
  });
  const topPj = Object.values(pjMap).sort((a,b) => b.count - a.count).slice(0, 5);
  renderTopPj(topPj);

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

function renderDonut(stats) {
  const total = stats.active + stats.warning + stats.expired;
  if (total === 0) {
    document.getElementById('donutChart').innerHTML = '<div class="donut-center"><div class="big">0</div><div class="small">data</div></div>';
    return;
  }
  const r = 60;
  const c = 2 * Math.PI * r;
  const activePct = stats.active / total;
  const warningPct = stats.warning / total;
  const expiredPct = stats.expired / total;

  document.getElementById('donutChart').innerHTML = `
    <svg width="140" height="140" viewBox="0 0 140 140">
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--bg-elev)" stroke-width="16"/>
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--success)" stroke-width="16" stroke-dasharray="${activePct*c} ${c}" stroke-linecap="round"/>
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--warning)" stroke-width="16" stroke-dasharray="${warningPct*c} ${c}" stroke-dashoffset="${-activePct*c}" stroke-linecap="round"/>
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--danger)" stroke-width="16" stroke-dasharray="${expiredPct*c} ${c}" stroke-dashoffset="${-(activePct+warningPct)*c}" stroke-linecap="round"/>
    </svg>
    <div class="donut-center"><div class="big">${total}</div><div class="small">total</div></div>
  `;

  document.getElementById('donutLegend').innerHTML = `
    <div class="donut-item"><div class="donut-dot" style="background:var(--success);"></div><span class="donut-label">Aktif</span><span class="donut-value">${stats.active}</span></div>
    <div class="donut-item"><div class="donut-dot" style="background:var(--warning);"></div><span class="donut-label">Akan Mati</span><span class="donut-value">${stats.warning}</span></div>
    <div class="donut-item"><div class="donut-dot" style="background:var(--danger);"></div><span class="donut-label">Mati</span><span class="donut-value">${stats.expired}</span></div>
  `;
}

function renderBar(id, data) {
  const max = Math.max(...data.map(d => d.value), 1);
  document.getElementById(id).innerHTML = data.map(d => `
    <div class="bar-row">
      <div class="bar-label">${d.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(d.value/max*100)}%;">${d.value > 0 ? d.value : ''}</div></div>
      <div class="bar-value">${d.value}</div>
    </div>
  `).join('') || '<div class="empty-state" style="padding:20px;"><p>Tidak ada data</p></div>';
}

function renderTopPj(list) {
  if (list.length === 0) {
    document.getElementById('topPj').innerHTML = '<div class="empty-state" style="padding:20px;"><p>Tidak ada data</p></div>';
    return;
  }
  document.getElementById('topPj').innerHTML = list.map((p, i) => `
    <div class="top-item">
      <div class="top-rank">${i+1}</div>
      <div class="top-info"><div class="top-name">${p.pj}</div><div class="top-meta">${p.hp}</div></div>
      <div class="top-count">${p.count}</div>
    </div>
  `).join('');
}

// ============================================
// EXPORT EXCEL MULTI-SHEET
// ============================================
async function exportExcel() {
  const btn = document.getElementById('btnExcel');
  const origText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Memproses...';

  try {
    if (typeof XLSX === 'undefined') {
      alert('Library Excel belum termuat. Refresh halaman lalu coba lagi.');
      btn.disabled = false; btn.innerHTML = origText;
      return;
    }

    // ===== AMBIL SEMUA DATA =====
    toast('Mengambil data...', 'Menyiapkan laporan Excel', 'info');

    const [kendaraanRes, logRes, adminRes] = await Promise.all([
      supabaseClient.from('kendaraan').select('*').order('plate', { ascending: true }),
      supabaseClient.from('notifikasi_log').select('*, kendaraan(plate, type, pj)').order('created_at', { ascending: false }).limit(500),
      supabaseClient.from('admin_chats').select('*').order('nama', { ascending: true }),
    ]);

    const kendaraan = (kendaraanRes.data || []).map(window.dbToUi);
    const logs = logRes.data || [];
    const admins = adminRes.data || [];

    if (kendaraan.length === 0) {
      toast('Data kosong', 'Belum ada kendaraan untuk dilaporkan', 'warning');
      btn.disabled = false; btn.innerHTML = origText;
      return;
    }

    // ===== BUAT WORKBOOK =====
    const wb = XLSX.utils.book_new();
    const today = new Date();
    const todayStr = today.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
    const todayFile = today.toISOString().split('T')[0];

    // ===== SHEET 1: RINGKASAN =====
    const stats = { active: 0, warning: 0, expired: 0, noPajakDate: 0 };
    kendaraan.forEach(v => {
      if (!v.pajakDate) { stats.noPajakDate++; return; }
      const d = Math.ceil((new Date(v.pajakDate) - today) / 86400000);
      if (d > 30) stats.active++;
      else if (d > 0) stats.warning++;
      else stats.expired++;
    });

    const byJenis = {};
    kendaraan.forEach(v => byJenis[v.jenis] = (byJenis[v.jenis] || 0) + 1);

    const byAsal = {};
    kendaraan.forEach(v => {
      const lbl = ORIGIN_LABELS[v.asal] || v.asal;
      byAsal[lbl] = (byAsal[lbl] || 0) + 1;
    });

    const ringkasan = [
      ['LAPORAN MONITORING KENDARAAN DINAS'],
      ['SIMOPAS - Sistem Monitoring Pajak & Service'],
      ['Tanggal Cetak:', todayStr],
      [],
      ['STATISTIK UMUM'],
      ['Total Kendaraan', kendaraan.length],
      ['Pajak Aktif (>30 hari)', stats.active],
      ['Pajak Akan Mati (<30 hari)', stats.warning],
      ['Pajak Mati', stats.expired],
      ['Belum Ada Tgl Pajak', stats.noPajakDate],
      [],
      ['DISTRIBUSI PER JENIS'],
      ...Object.entries(byJenis).map(([k,v]) => [k, v]),
      [],
      ['DISTRIBUSI PER ASAL'],
      ...Object.entries(byAsal).map(([k,v]) => [k, v]),
      [],
      ['STATISTIK NOTIFIKASI'],
      ['Total Notifikasi Terkirim', logs.filter(l => l.status === 'sent').length],
      ['Total Notifikasi Gagal', logs.filter(l => l.status === 'failed').length],
      ['Total PJ', new Set(kendaraan.map(v => v.pj)).size],
      ['Total Admin Aktif', admins.filter(a => a.aktif).length],
    ];

    const wsRingkasan = XLSX.utils.aoa_to_sheet(ringkasan);
    wsRingkasan['!cols'] = [{ wch: 32 }, { wch: 25 }];
    // Merge judul
    wsRingkasan['!merges'] = [
      { s: { r: 0, c: 0 }, e: { r: 0, c: 1 } },
      { s: { r: 1, c: 0 }, e: { r: 1, c: 1 } },
    ];
    XLSX.utils.book_append_sheet(wb, wsRingkasan, '1. Ringkasan');

    // ===== SHEET 2: DAFTAR KENDARAAN =====
    const kendaraanHeader = [
      'No', 'No. Polisi', 'Jenis', 'Type', 'Asal',
      'No. STNK', 'Tgl STNK', 'No. Pajak', 'Tgl Pajak',
      'Tgl Service', 'KM Saat Ini', 'KM Max',
      'Nama PJ', 'No. HP', 'Username TG', 'Telegram Chat ID', 'Email PJ',
      'Notif Telegram', 'Notif Email', 'Terakhir Notif'
    ];
    const kendaraanRows = kendaraan.map((v, i) => [
      i + 1,
      v.plate,
      v.jenis,
      v.type,
      ORIGIN_LABELS[v.asal] || v.asal,
      v.stnk || '-',
      v.stnkDate ? formatTgl(v.stnkDate) : '-',
      v.noPajak || '-',
      v.pajakDate ? formatTgl(v.pajakDate) : '-',
      v.serviceDate ? formatTgl(v.serviceDate) : '-',
      v.km || 0,
      v.kmMax || 10000,
      v.pj,
      v.hp,
      v.tg || '-',
      v.telegramChatId || '-',
      v.email || '-',
      v.notifTg ? 'Ya' : 'Tidak',
      v.notifEmail ? 'Ya' : 'Tidak',
      v.lastSent ? formatTgl(v.lastSent) : '-',
    ]);
    const wsKendaraan = XLSX.utils.aoa_to_sheet([kendaraanHeader, ...kendaraanRows]);
    wsKendaraan['!cols'] = [
      { wch: 4 }, { wch: 12 }, { wch: 8 }, { wch: 22 }, { wch: 16 },
      { wch: 14 }, { wch: 13 }, { wch: 14 }, { wch: 13 },
      { wch: 13 }, { wch: 10 }, { wch: 10 },
      { wch: 22 }, { wch: 14 }, { wch: 16 }, { wch: 16 }, { wch: 25 },
      { wch: 14 }, { wch: 12 }, { wch: 14 }
    ];
    XLSX.utils.book_append_sheet(wb, wsKendaraan, '2. Daftar Kendaraan');

    // ===== SHEET 3: JADWAL JATUH TEMPO =====
    const jadwal = [];
    kendaraan.forEach(v => {
      const items = [
        { tipe: 'Pajak Tahunan', tgl: v.pajakDate },
        { tipe: 'STNK 5 Tahun', tgl: v.stnkDate },
        { tipe: 'Service Berkala', tgl: v.serviceDate },
      ];
      items.forEach(i => {
        if (i.tgl) {
          const d = Math.ceil((new Date(i.tgl) - today) / 86400000);
          let status = 'Aktif';
          if (d < 0) status = `Lewat ${Math.abs(d)} hari`;
          else if (d === 0) status = 'Jatuh tempo HARI INI';
          else if (d === 1) status = 'Besok';
          else if (d <= 7) status = `${d} hari lagi`;
          else if (d <= 30) status = `${d} hari lagi`;
          else status = 'Aktif';
          jadwal.push({
            tipe: i.tipe,
            plate: v.plate,
            type: v.type,
            tgl: i.tgl,
            tglFormat: formatTgl(i.tgl),
            hariSisa: d,
            status: status,
            pj: v.pj,
            hp: v.hp,
          });
        }
      });
    });
    jadwal.sort((a,b) => a.hariSisa - b.hariSisa);

    const jadwalHeader = ['No', 'No. Polisi', 'Kendaraan', 'Tipe', 'Jatuh Tempo', 'Hari Sisa', 'Status', 'Nama PJ', 'No. HP'];
    const jadwalRows = jadwal.map((j, i) => [
      i + 1, j.plate, j.type, j.tipe, j.tglFormat, j.hariSisa, j.status, j.pj, j.hp
    ]);
    const wsJadwal = XLSX.utils.aoa_to_sheet([jadwalHeader, ...jadwalRows]);
    wsJadwal['!cols'] = [
      { wch: 4 }, { wch: 12 }, { wch: 22 }, { wch: 16 },
      { wch: 18 }, { wch: 10 }, { wch: 22 }, { wch: 22 }, { wch: 14 }
    ];
    XLSX.utils.book_append_sheet(wb, wsJadwal, '3. Jadwal Jatuh Tempo');

    // ===== SHEET 4: DAFTAR PJ =====
    const pjMap = {};
    kendaraan.forEach(v => {
      const k = v.pj + '|' + v.hp;
      if (!pjMap[k]) {
        pjMap[k] = {
          nama: v.pj, hp: v.hp, tg: v.tg || '-',
          email: v.email || '-',
          telegramChatId: v.telegramChatId || '-',
          jumlah: 0, plates: []
        };
      }
      pjMap[k].jumlah++;
      pjMap[k].plates.push(v.plate);
    });
    const pjList = Object.values(pjMap).sort((a,b) => b.jumlah - a.jumlah);
    const pjHeader = ['No', 'Nama PJ', 'No. HP', 'Username Telegram', 'Email', 'Telegram Chat ID', 'Bot Aktif', 'Jumlah Kendaraan', 'Plat Kendaraan'];
    const pjRows = pjList.map((p, i) => [
      i + 1, p.nama, p.hp, p.tg, p.email, p.telegramChatId,
      p.telegramChatId !== '-' ? 'Ya' : 'Belum',
      p.jumlah, p.plates.join(', ')
    ]);
    const wsPj = XLSX.utils.aoa_to_sheet([pjHeader, ...pjRows]);
    wsPj['!cols'] = [
      { wch: 4 }, { wch: 22 }, { wch: 14 }, { wch: 16 },
      { wch: 25 }, { wch: 16 }, { wch: 10 }, { wch: 14 }, { wch: 35 }
    ];
    XLSX.utils.book_append_sheet(wb, wsPj, '4. Daftar PJ');

    // ===== SHEET 5: LOG NOTIFIKASI =====
    const TIPE_LABEL = { pajak: 'Pajak Tahunan', stnk: 'STNK 5 Tahun', service: 'Service Berkala' };
    const CHANNEL_LABEL = { telegram: 'Telegram', email: 'Email' };
    const STATUS_LABEL = { sent: 'Terkirim', failed: 'Gagal' };

    const logHeader = ['No', 'Tanggal & Jam', 'No. Polisi', 'Kendaraan', 'PJ', 'Tipe', 'Channel', 'Status', 'Hari Ke', 'Keterangan Error'];
    const logRows = logs.map((l, i) => {
      const k = l.kendaraan || {};
      const dt = new Date(l.created_at);
      return [
        i + 1,
        dt.toLocaleString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
        k.plate || '-',
        k.type || '-',
        k.pj || '-',
        TIPE_LABEL[l.tipe] || l.tipe,
        CHANNEL_LABEL[l.channel] || l.channel,
        STATUS_LABEL[l.status] || l.status,
        l.hari_ke !== null ? (l.hari_ke < 0 ? `Lewat ${Math.abs(l.hari_ke)} hari` : `H-${l.hari_ke}`) : '-',
        l.error_msg || '-'
      ];
    });
    const wsLog = XLSX.utils.aoa_to_sheet([logHeader, ...logRows]);
    wsLog['!cols'] = [
      { wch: 4 }, { wch: 18 }, { wch: 12 }, { wch: 22 }, { wch: 22 },
      { wch: 16 }, { wch: 10 }, { wch: 10 }, { wch: 14 }, { wch: 35 }
    ];
    XLSX.utils.book_append_sheet(wb, wsLog, '5. Log Notifikasi');

    // ===== DOWNLOAD =====
    const filename = `SIMOPAS-Report-${todayFile}.xlsx`;
    XLSX.writeFile(wb, filename);

    toast('Berhasil!', `File ${filename} sudah didownload`);
  } catch (err) {
    console.error('Export error:', err);
    toast('Gagal export', err.message, 'danger');
  }

  btn.disabled = false;
  btn.innerHTML = origText;
}

function formatTgl(d) {
  if (!d) return '-';
  return new Date(d).toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

(async function init() {
