<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penanggung Jawab — SIMOPAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.pj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

.pj-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; cursor: pointer; transition: all 0.15s; }
.pj-card:hover { border-color: var(--border-hi); transform: translateY(-1px); }

.pj-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.pj-avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-2), var(--purple)); display: grid; place-items: center; font-weight: 700; font-size: 16px; color: white; flex-shrink: 0; }
.pj-info { flex: 1; min-width: 0; }
.pj-name { font-weight: 700; font-size: 15px; }
.pj-hp { font-size: 11px; color: var(--text-mute); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }

.pj-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); }
.pj-stat { text-align: center; }
.pj-stat-value { font-family: 'Instrument Serif', serif; font-size: 22px; line-height: 1; margin-bottom: 4px; }
.pj-stat-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.05em; }

.pj-tg-status { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border); }
.tg-status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 100px; font-size: 10px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.tg-status-pill.ready { background: rgba(46, 229, 157, 0.1); color: var(--success); }
.tg-status-pill.pending { background: rgba(255, 159, 67, 0.12); color: var(--warning); }
.tg-status-pill svg { width: 11px; height: 11px; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
.modal-overlay.show { display: flex; }
.modal { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
.modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h2 { font-family: 'Instrument Serif', serif; font-size: 24px; }
.modal-close { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; width: 32px; height: 32px; border-radius: 8px; }
.modal-body { padding: 20px 24px; }
.k-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
.k-item .plate { flex-shrink: 0; }
.k-info { flex: 1; min-width: 0; }
.k-title { font-weight: 600; font-size: 13px; }
.k-meta { font-size: 11px; color: var(--text-mute); margin-top: 2px; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="page-title">
        <h1>Penanggung <em>Jawab</em></h1>
        <p>Daftar PJ kendaraan dan status registrasi Telegram bot</p>
      </div>
      <div class="topbar-actions">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5a647a" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="Cari nama PJ..." id="searchInput">
        </div>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
      <div class="pill active" data-filter="all" onclick="setFilter('all')">Semua <span class="pill-count" id="cAll">0</span></div>
      <div class="pill" data-filter="ready" onclick="setFilter('ready')">Bot Terdaftar <span class="pill-count" id="cReady">0</span></div>
      <div class="pill" data-filter="pending" onclick="setFilter('pending')">Belum Daftar <span class="pill-count" id="cPending">0</span></div>
    </div>

    <div id="loadingState" class="loading"><div class="loading-spinner"></div>Memuat data PJ...</div>
    <div class="pj-grid" id="pjGrid" style="display:none;"></div>
  </main>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Detail PJ</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
let pjList = [];
let allVehicles = [];
let currentFilter = 'all';
let searchTerm = '';

async function loadData() {
  const { data, error } = await supabaseClient.from('kendaraan').select('*');
  if (error) { toast('Gagal memuat', error.message, 'danger'); return; }
  allVehicles = (data || []).map(dbToUi);

  // Group by PJ
  const map = {};
  allVehicles.forEach(v => {
    const key = `${v.pj}|${v.hp}`;
    if (!map[key]) {
      map[key] = { pj: v.pj, hp: v.hp, tg: v.tg, telegramChatId: v.telegramChatId, kendaraan: [] };
    }
    map[key].kendaraan.push(v);
    if (v.telegramChatId && !map[key].telegramChatId) map[key].telegramChatId = v.telegramChatId;
  });

  pjList = Object.values(map).sort((a,b) => a.pj.localeCompare(b.pj));
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('pjGrid').style.display = 'grid';
  render();
}

function getInitials(name) {
  return name.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
}

function render() {
  const totalReady = pjList.filter(p => p.telegramChatId).length;
  const totalPending = pjList.filter(p => !p.telegramChatId).length;

  document.getElementById('cAll').textContent = pjList.length;
  document.getElementById('cReady').textContent = totalReady;
  document.getElementById('cPending').textContent = totalPending;

  let filtered = pjList;
  if (searchTerm) {
    const t = searchTerm.toLowerCase();
    filtered = pjList.filter(p => p.pj.toLowerCase().includes(t) || p.hp.includes(t));
  }
  if (currentFilter === 'ready') filtered = filtered.filter(p => p.telegramChatId);
  else if (currentFilter === 'pending') filtered = filtered.filter(p => !p.telegramChatId);

  const grid = document.getElementById('pjGrid');
  if (filtered.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;" class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg><h3>Tidak ada PJ</h3></div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const expired = p.kendaraan.filter(v => getStatus(daysUntil(v.pajakDate)) === 'expired').length;
    const ready = !!p.telegramChatId;
    return `<div class="pj-card" onclick='showDetail(${JSON.stringify(p).replace(/'/g, "&#39;")})'>
      <div class="pj-header">
        <div class="pj-avatar">${getInitials(p.pj)}</div>
        <div class="pj-info">
          <div class="pj-name">${p.pj}</div>
          <div class="pj-hp">${p.hp}</div>
        </div>
      </div>
      <div class="pj-stats">
        <div class="pj-stat"><div class="pj-stat-value">${p.kendaraan.length}</div><div class="pj-stat-label">Kendaraan</div></div>
        <div class="pj-stat"><div class="pj-stat-value" style="color:${expired > 0 ? 'var(--danger)' : 'var(--text)'};">${expired}</div><div class="pj-stat-label">Pajak Mati</div></div>
      </div>
      <div class="pj-tg-status">
        <span class="cell-secondary">Status Bot:</span>
        <span class="tg-status-pill ${ready ? 'ready' : 'pending'}">
          ${ready ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>TERDAFTAR' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg>BELUM'}
        </span>
      </div>
    </div>`;
  }).join('');
}

function showDetail(p) {
  document.getElementById('modalTitle').textContent = p.pj;
  document.getElementById('modalBody').innerHTML = `
    <div style="margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
        <div class="pj-avatar">${getInitials(p.pj)}</div>
        <div>
          <div style="font-weight:700;font-size:16px;">${p.pj}</div>
          <div class="cell-secondary">${p.hp}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <div class="tg-status-pill ${p.telegramChatId ? 'ready' : 'pending'}">${p.telegramChatId ? '✓ Bot terdaftar' : '✗ Belum daftar bot'}</div>
        ${p.telegramChatId ? `<div class="tg-status-pill ready" style="background:var(--bg-card);color:var(--text-dim);">Chat ID: ${p.telegramChatId}</div>` : ''}
      </div>
    </div>

    <div style="margin-bottom:8px;">
      <span class="cell-secondary">KENDARAAN YANG DIPEGANG (${p.kendaraan.length})</span>
    </div>
    ${p.kendaraan.map(v => {
      const days = daysUntil(v.pajakDate);
      const status = getStatus(days);
      const statusClass = status === 'active' ? 'status-active' : status === 'warning' ? 'status-warning' : 'status-expired';
      const statusText = status === 'active' ? 'AKTIF' : status === 'warning' ? 'SEGERA' : 'MATI';
      return `<div class="k-item">
        <span class="plate">${v.plate}</span>
        <div class="k-info">
          <div class="k-title">${v.type}</div>
          <div class="k-meta">Pajak: ${formatDate(v.pajakDate)} (${formatDays(days)})</div>
        </div>
        <span class="status-badge ${statusClass}">${statusText}</span>
      </div>`;
    }).join('')}
  `;
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.filter === f));
  render();
}

document.getElementById('searchInput').oninput = e => { searchTerm = e.target.value; render(); };
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

(async function init() {
  const user = await simopasInit('pj');
  if (user) await loadData();
})();
</script>

</body>
</html>
