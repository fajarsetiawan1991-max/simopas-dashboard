<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Aktivitas — SIMOPAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.timeline { position: relative; padding-left: 32px; }
.timeline::before { content: ''; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.t-item { position: relative; padding: 12px 0 16px; }
.t-dot { position: absolute; left: -32px; top: 14px; width: 24px; height: 24px; border-radius: 50%; background: var(--bg-card); border: 2px solid var(--border); display: grid; place-items: center; }
.t-dot svg { width: 11px; height: 11px; color: var(--text-dim); }
.t-dot.create { border-color: var(--success); } .t-dot.create svg { color: var(--success); }
.t-dot.edit { border-color: var(--info); } .t-dot.edit svg { color: var(--info); }
.t-dot.delete { border-color: var(--danger); } .t-dot.delete svg { color: var(--danger); }
.t-dot.notif { border-color: var(--warning); } .t-dot.notif svg { color: var(--warning); }
.t-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
.t-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-wrap: wrap; gap: 8px; }
.t-action { font-weight: 600; font-size: 13px; }
.t-time { font-size: 11px; color: var(--text-mute); font-family: 'JetBrains Mono', monospace; }
.t-user { font-size: 11px; color: var(--text-dim); }
.t-detail { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

.info-box { background: rgba(111, 168, 255, 0.08); border: 1px solid rgba(111, 168, 255, 0.2); border-left: 3px solid var(--info); border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="page-title">
        <h1>Log <em>Aktivitas</em></h1>
        <p>Audit trail semua aksi yang dilakukan di sistem</p>
      </div>
      <div class="topbar-actions">
        <button class="btn" onclick="loadData()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Refresh
        </button>
      </div>
    </div>

    <div class="info-box">
      <strong style="color:var(--info);">ℹ️ Tentang Log Aktivitas</strong><br>
      Tabel ini mencatat aksi-aksi penting di sistem (tambah, edit, hapus kendaraan, kirim notifikasi manual). Untuk log notifikasi otomatis dari bot, buka menu <a href="notifikasi.html" style="color:var(--accent);">Notifikasi</a>.
    </div>

    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Riwayat Aktivitas</h3>
        <span class="cell-secondary" id="totalLog">0 log</span>
      </div>
      <div id="loadingState" class="loading"><div class="loading-spinner"></div>Memuat log...</div>
      <div class="timeline" id="timeline" style="display:none;"></div>
    </div>
  </main>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
async function loadData() {
  const { data, error } = await supabaseClient
    .from('aktivitas_log')
    .select('*, kendaraan(plate, type)')
    .order('created_at', { ascending: false })
    .limit(200);

  if (error && error.code !== 'PGRST116') { toast('Gagal memuat', error.message, 'danger'); return; }

  document.getElementById('loadingState').style.display = 'none';
  const tl = document.getElementById('timeline');
  tl.style.display = 'block';

  const logs = data || [];
  document.getElementById('totalLog').textContent = `${logs.length} log`;

  if (logs.length === 0) {
    tl.innerHTML = `<div class="empty-state" style="padding:40px 20px;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><h3>Belum ada aktivitas</h3><p>Log akan muncul saat ada aksi di sistem</p></div>`;
    return;
  }

  const ACTION_ICONS = {
    create: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
    delete: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
    notif: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>'
  };

  tl.innerHTML = logs.map(l => {
    let type = 'edit';
    if (l.aksi.toLowerCase().includes('tambah') || l.aksi.toLowerCase().includes('create')) type = 'create';
    else if (l.aksi.toLowerCase().includes('hapus') || l.aksi.toLowerCase().includes('delete')) type = 'delete';
    else if (l.aksi.toLowerCase().includes('kirim') || l.aksi.toLowerCase().includes('notif')) type = 'notif';

    return `<div class="t-item">
      <div class="t-dot ${type}">${ACTION_ICONS[type]}</div>
      <div class="t-content">
        <div class="t-head">
          <div><span class="t-action">${l.aksi}</span> <span class="cell-secondary">• ${l.modul}</span></div>
          <span class="t-time">${formatDateTime(l.created_at)}</span>
        </div>
        <div class="t-user">oleh <strong style="color:var(--text);">${l.user_name || l.user_email || 'Sistem'}</strong></div>
        ${l.detail ? `<div class="t-detail">${l.detail}</div>` : ''}
        ${l.kendaraan ? `<div class="t-detail">Kendaraan: <span class="plate" style="margin-left:4px;">${l.kendaraan.plate}</span> ${l.kendaraan.type}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

(async function init() {
  const user = await simopasInit('log');
  if (user) await loadData();
})();
</script>

</body>
</html>
